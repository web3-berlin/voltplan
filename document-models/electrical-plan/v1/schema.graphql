type ElectricalPlanState {
  name: String!
  activeUnitId: OID!
  units: [ElectricalUnit!]!
  circuits: [ElectricalCircuit!]!
  routes: [CableRoute!]
  distributors: [ElectricalDistributor!]!
  cabinetDevices: [CabinetDevice!]!
  groupAddresses: [GroupAddress!]!
  reports: [InspectionReport!]!
  settings: ElectricalSettings!
  nextCircuitNumber: Int!
}

type ElectricalUnit {
  id: OID!
  name: String!
  level: Int!
  background: PlanBackground
  rooms: [ElectricalRoom!]
  symbols: [ElectricalSymbol!]!
}

type ElectricalRoom {
  id: OID!
  name: String!
  points: [Position!]!
  fillColor: String
  labelX: Float!
  labelY: Float!
  locked: Boolean
}

type PlanBackground {
  dataUrl: String
  widthCm: Float
  heightCm: Float
  x: Float!
  y: Float!
  scale: Float!
  opacity: Float!
  rotation: Float!
  locked: Boolean!
}

type Position {
  x: Float!
  y: Float!
}

type KnxBinding {
  enabled: Boolean!
  participantName: String
  groupAddressIds: [OID!]
}

type ItemDetails {
  note: String
  price: Float
  photos: [String!]
}

type ElectricalSymbol {
  id: OID!
  defId: String!
  position: Position!
  rotation: Float!
  mountHeightCm: Float
  circuitId: OID
  roomId: String
  label: String
  color: String
  locked: Boolean
  knx: KnxBinding
  details: ItemDetails
}

type ElectricalBreaker {
  poles: Int!
  ratingA: Float!
  characteristic: String!
  rcdMa: Int
  rcbo: Boolean
}

type ElectricalCable {
  type: String!
  crossSectionMm2: Float!
  lengthM: Float
}

type ElectricalCircuit {
  id: OID!
  skNumber: Int!
  name: String!
  kind: String!
  distributorId: OID
  breaker: ElectricalBreaker!
  cable: ElectricalCable!
  phases: [String!]
  color: String
  notes: String
  installationMethod: String
  ambientTempC: Float
  groupedCircuits: Int
}

type CableRoute {
  id: OID!
  circuitId: OID!
  unitId: OID!
  points: [Position!]!
  reservePercent: Float
}

type ElectricalDistributor {
  id: OID!
  name: String!
  rows: Int!
