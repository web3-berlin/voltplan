type HlskPlanState {
  name: String!
  activeUnitId: OID!
  units: [HlskUnit!]!
  settings: HlskSettings!
  nextFixtureNumber: Int!
}

type HlskUnit {
  id: OID!
  name: String!
  level: Int!
  background: PlanBackground
  rooms: [HlskRoom!]
  fixtures: [HlskFixture!]!
  pipeRoutes: [PipeRoute!]!
  ductRoutes: [DuctRoute!]!
  risers: [Riser!]!
}

type HlskRoom {
  id: OID!
  name: String!
  points: [Position!]!
  fillColor: String
  labelX: Float!
  labelY: Float!
  locked: Boolean
}

type PlanBackground {
  dataUrl: String
  widthCm: Float
  heightCm: Float
  x: Float!
  y: Float!
  scale: Float!
  opacity: Float!
  rotation: Float!
  locked: Boolean!
}

type Position {
  x: Float!
  y: Float!
}

type HlskFixture {
  id: OID!
  kind: String!
  discipline: String!
  name: String!
  position: Position!
  rotation: Float!
  roomId: String
  mountHeightCm: Float
  notes: String
  locked: Boolean
}

type PipeRoute {
  id: OID!
